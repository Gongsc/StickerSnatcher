services:
  stickersnatcher:
    build: .
    ports:
      - "127.0.0.1:${STICKER_PORT:-8765}:8765"
    volumes:
      - sticker-cache:/app/.stickers/cache
      - ./exports:/exports
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sticker-cache:
